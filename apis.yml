name: Qarbotech
description: >-
  Qarbotech (Qarbotech Sdn Bhd) is a Malaysian agritech and nanotechnology company that develops
  biocompatible organic compounds to optimize plant photosynthesis and raise agricultural
  productivity. Its flagship product, QarboGrow, is a photosynthesis-enhancing treatment marketed to
  boost photosynthetic efficiency and lift crop yields by roughly 20-30% while improving plant health,
  disease resistance, and crop quality, alongside the Harvast and Harvast+ product lines. Headquartered
  in Puchong, Selangor with additional offices in Bukit Mertajam, Penang and Jakarta, Indonesia, the
  company was surfaced as a portfolio company of 500 Global. Qarbotech is a physical-product agritech
  business and publishes no public developer, API, or documentation surface as of this enrichment pass.
